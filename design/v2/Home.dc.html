<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
  <style>

    body { margin: 0; background: #070A14;
      font-family: "Outfit", -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #2FD9FF; text-decoration: none; }
    a:hover { color: #8BE9FF; }
    .glass { background: rgba(11,16,32,0.74); border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .stat-lbl { font-size: 8.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
      color: rgba(255,255,255,0.48); }
    .stat-val { font-size: 27px; font-weight: 800; color: #fff; line-height: 29px; letter-spacing: -0.8px;
      font-variant-numeric: tabular-nums; }
    .stat-unit { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.45); margin-left: 1px; }
    .stat-sub { font-size: 9.5px; font-weight: 600; color: rgba(255,255,255,0.52); margin-top: 3px;
      font-variant-numeric: tabular-nums; }
    .divider { width: 1px; align-self: stretch; margin: 4px 0;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0) 100%); }
    .rbtn { width: 58px; height: 58px; border-radius: 29px;
      background: linear-gradient(180deg, rgba(62,78,126,0.92) 0%, rgba(24,32,58,0.94) 100%);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.22);
      display: flex; align-items: center; justify-content: center; position: relative; }
    .rbtn-cap { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center;
      font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.62); letter-spacing: 0.4px; }
    .cta { border-radius: 16px; padding: 17px; text-align: center; font-size: 16px; font-weight: 800; color: #062330;
      background: linear-gradient(180deg, #5FE4FF 0%, #0E96D2 100%);
      border: 1px solid rgba(255,255,255,0.42);
      box-shadow: 0 10px 26px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.45); }
    .ghost { border-radius: 16px; padding: 15px; text-align: center; font-size: 14.5px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); }
    .eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase;
      color: rgba(255,255,255,0.42); }

  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #070A14; overflow: hidden; position: relative; padding: 62px 22px 30px; display: flex; flex-direction: column">

  <svg width="390" height="300" viewBox="0 0 390 300" style="position: absolute; top: 0; left: 0">
    <defs><radialGradient id="hg" cx="0.5" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#16385A" stop-opacity="0.85"/><stop offset="1" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient></defs>
    <rect width="390" height="300" fill="url(#hg)"/>
  </svg>

  <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; position: relative">
    <div>
      <div style="color: #fff; font-size: 30px; font-weight: 800; letter-spacing: -1px">DEADRUN</div>
      <div style="color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; margin-top: 2px">구역 C-7 · 여의도</div>
    </div>
    <div class="glass" style="border-radius: 16px; padding: 8px 12px; text-align: right">
      <div class="stat-lbl">누적</div>
      <div style="color: #2FD9FF; font-size: 17px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums">128.4<span style="font-size:10px;color:rgba(255,255,255,0.45)">km</span></div>
    </div>
  </div>

  <div class="glass" style="border-radius: 22px; padding: 16px; margin-top: 22px; position: relative">
    <div class="eyebrow">이번 주 · 7주 연속 달성 중</div>
    <div style="display: flex; flex-direction: row; align-items: flex-end; gap: 6px; margin-top: 7px">
      <div style="color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums">15.33</div>
      <div style="color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 600; margin-bottom: 6px">/ 20km</div>
      <div style="margin-left: auto; margin-bottom: 7px; color: #7CFF5B; font-size: 11.5px; font-weight: 800">4.67km 남음</div>
    </div>
    <div style="height: 6px; border-radius: 3px; background: rgba(255,255,255,0.09); margin-top: 10px; overflow: hidden">
      <div style="width: 77%; height: 6px; border-radius: 3px; background: linear-gradient(90deg,#1795C2,#2FD9FF)"></div>
    </div>
    <div style="color: rgba(255,255,255,0.45); font-size: 11px; font-weight: 600; margin-top: 8px">고강도 23분 40초 · 주 권고 75분의 32%</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 18px">
    <div class="glass" style="border-radius: 18px; padding: 13px 15px; display: flex; flex-direction: row; align-items: center; justify-content: space-between">
      <div>
        <div style="color: #fff; font-size: 14px; font-weight: 700">실외 GPS 모드</div>
        <div style="color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 2px">현재 위치 주변 실제 도로에서 달린다</div>
      </div>
      <div style="width: 46px; height: 27px; border-radius: 14px; background: #2FD9FF; position: relative; flex-shrink: 0">
        <div style="position: absolute; top: 2.5px; left: 21.5px; width: 22px; height: 22px; border-radius: 11px; background: #fff"></div>
      </div>
    </div>
    <div class="glass" style="border-radius: 18px; padding: 13px 15px; display: flex; flex-direction: row; align-items: center; justify-content: space-between">
      <div>
        <div style="color: #fff; font-size: 14px; font-weight: 700">개체 밀도</div>
        <div style="color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 2px">1km²당 40마리 · 최대 120</div>
      </div>
      <div style="display: flex; flex-direction: row; gap: 5px">
        <div style="padding: 5px 10px; border-radius: 9px; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 700">낮음</div>
        <div style="padding: 5px 10px; border-radius: 9px; background: #2FD9FF; color: #062330; font-size: 11px; font-weight: 800">보통</div>
        <div style="padding: 5px 10px; border-radius: 9px; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 700">높음</div>
      </div>
    </div>
  </div>

  <div class="glass" style="border-radius: 18px; padding: 13px 15px; margin-top: 10px; display: flex; flex-direction: row; align-items: center; gap: 12px; border-color: rgba(255,197,61,0.34)">
    <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255,197,61,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#062330" stroke-width="2" stroke-linejoin="round">
      <rect x="3" y="9.5" width="18" height="11.5" rx="2"/><path d="M2 6.5h20v3.5H2z"/><path d="M12 6.5V21"/>
      <path d="M12 6.5S10.5 3 8 3a2.5 2.5 0 0 0 0 5h4Zm0 0S13.5 3 16 3a2.5 2.5 0 0 1 0 5h-4Z"/></svg></div>
    <div style="flex-grow: 1">
      <div style="color: #FFC53D; font-size: 13px; font-weight: 800">광고 보고 탄약 +10으로 시작</div>
      <div style="color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 2px">하루 3회 중 2회 남음</div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <div class="cta" style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 9px"><svg width="19" height="19" viewBox="0 0 24 24" fill="#062330"><path d="M7 4.5 19.5 12 7 19.5Z"/></svg><span>런 시작</span></div>
    <div class="ghost">내 기록 보기</div>
  </div>
</div>
</x-dc>
</body>
</html>
